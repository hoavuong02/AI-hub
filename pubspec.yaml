name: aihub
description: AI Hub is a lightweight Flutter app that brings multiple AI assistants together in one simple interface.
publish_to: 'none' 
version: 1.1.0+2

environment:
  sdk: ^3.9.2

dependencies:
  awesome_notifications: ^0.10.1
  dio: ^5.9.0
  dynamic_color: ^1.8.1
  file_picker: ^10.3.3
  flutter:
    sdk: flutter

  flutter_inappwebview: ^6.1.5
  flutter_svg: ^2.2.3
  http: ^1.5.0
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.1.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
