name: Build and Release Flutter App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------
      # VERSION STEPS FIRST
      # -------------------------

      - name: Read version from pubspec.yaml
        id: version
        run: |
          RAW=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          CLEAN_VERSION=$(echo "$RAW" | cut -d'+' -f1)
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Stop if tag already exists
        if: steps.tag_check.outputs.exists == 'true'
        run: |
          echo "Tag v${{ steps.version.outputs.version }} already exists. Stopping workflow."
          exit 1

      - name: Generate build number (timestamp)
        id: buildnumber
        run: |
          BUILD_NUMBER=$(date +%s)
          echo "number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Update version in pubspec.yaml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.buildnumber.outputs.number }}"
          sed -i "s/^version: .*/version: $VERSION+$BUILD/" pubspec.yaml

      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: update build number to ${{ steps.buildnumber.outputs.number }}"
          git push

      # -------------------------
      # NORMAL WORKFLOW CONTINUES
      # -------------------------

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Restore Flutter packages
        run: flutter pub get

      - name: Create keystore file
        run: |
          if [ -z "${{ secrets.KEYSTORE }}" ]; then
            echo "ERROR: KEYSTORE secret is not set"
            exit 1
          fi
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/release-keystore.jks

      # ---- Build Fat + Split APKs ----
      - name: Build Fat APK
        run: flutter build apk --release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Generate Release Notes
        id: notes
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            RANGE=""
          else
            RANGE="$LAST_TAG..HEAD"
          fi

          FEAT=$(git log --pretty=format:"%s" $RANGE | grep -i '^feat' | sed -E 's/^[Ff][Ee][Aa][Tt]:?[ ]*//' || true)
          FIX=$(git log --pretty=format:"%s" $RANGE | grep -i '^fix' | sed -E 's/^[Ff][Ii][Xx]:?[ ]*//' || true)
          REFACTOR=$(git log --pretty=format:"%s" $RANGE | grep -i '^refactor' | sed -E 's/^[Rr][Ee][Ff][Aa][Cc][Tt][Oo][Rr]:?[ ]*//' || true)

          NOTES_FILE=$(mktemp)
          echo "Changes:" >> $NOTES_FILE
          if [ -n "$FEAT" ]; then
            echo "$FEAT" | sed 's/^/- /' >> $NOTES_FILE
          else
            echo "- None" >> $NOTES_FILE
          fi

          echo "" >> $NOTES_FILE
          echo "Bug fixes:" >> $NOTES_FILE
          if [ -n "$FIX" ]; then
            echo "$FIX" | sed 's/^/- /' >> $NOTES_FILE
          else
            echo "- None" >> $NOTES_FILE
          fi

          echo "" >> $NOTES_FILE
          echo "Refactor:" >> $NOTES_FILE
          if [ -n "$REFACTOR" ]; then
            echo "$REFACTOR" | sed 's/^/- /' >> $NOTES_FILE
          else
            echo "- None" >> $NOTES_FILE
          fi

          # Use delimiter that won't conflict with the content
          EOF_MARKER=$(openssl rand -hex 16)
          echo "notes<<$EOF_MARKER" >> $GITHUB_OUTPUT
          cat $NOTES_FILE >> $GITHUB_OUTPUT
          echo "$EOF_MARKER" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with APKs
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ steps.buildnumber.outputs.number }}
          name: Release v${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
