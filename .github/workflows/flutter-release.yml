name: Flutter Build and Release APK

on:
  workflow_dispatch

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install Flutter (fixed PATH issue)
      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git -b stable --depth 1
          echo "$(pwd)/flutter/bin" >> $GITHUB_PATH
          # Reload PATH to make flutter available immediately
          echo "$(pwd)/flutter/bin" >> $GITHUB_ENV

      # 3. Verify Flutter installation
      - name: Verify Flutter
        run: |
          which flutter
          flutter --version

      # 4. Install GitHub CLI
      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install gh -y

      # 5. Setup Flutter and get dependencies
      - name: Setup Project
        run: |
          flutter doctor -v
          flutter pub get

      # 6. Extract version from pubspec.yaml
      - name: Get Version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          SAFE_VERSION=$(echo "$VERSION" | tr '+' '-')
          echo "version=$SAFE_VERSION" >> $GITHUB_OUTPUT
          echo "App version: $SAFE_VERSION"

      # 7. Build APK
      - name: Build APK
        run: flutter build apk --release

      # 8. Create GitHub Release and Upload APK
      - name: Create Release
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          FILE="build/app/outputs/flutter-apk/app-release.apk"
          
          echo "Creating APK release $TAG"
          
          # Create release with APK
          gh release create "$TAG" "$FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $TAG" \
            --notes "Automated APK release from GitHub Actions
            
            Build Date: $(date)
            Commit: $GITHUB_SHA
            Workflow: $GITHUB_WORKFLOW"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
