name: Flutter Build and Release APK

on:
  workflow_dispatch

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install Flutter (recommended approach)
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'
          cache: true

      # 3. Install GitHub CLI
      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install gh -y

      # 4. Setup project
      - name: Setup Project
        run: |
          flutter doctor -v
          flutter pub get

      # 5. Extract version
      - name: Get Version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          SAFE_VERSION=$(echo "$VERSION" | tr '+' '-')
          echo "version=$SAFE_VERSION" >> $GITHUB_OUTPUT
          echo "App version: $SAFE_VERSION"

      # 6. Build APK
      - name: Build APK
        run: flutter build apk --release

      # 7. Create Release
      - name: Create Release
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          FILE="build/app/outputs/flutter-apk/app-release.apk"
          
          gh release create "$TAG" "$FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $TAG" \
            --notes "Automated APK release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
