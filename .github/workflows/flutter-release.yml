name: Flutter Build and Release APK

on:
  workflow_dispatch

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Cache Flutter SDK
      - name: Cache Flutter SDK
        uses: actions/cache@v3
        with:
          path: /home/runner/flutter
          key: flutter-stable-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            flutter-stable-

      # 3. Cache Pub dependencies
      - name: Cache Pub dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # 4. Install Flutter (only if cache miss)
      - name: Install Flutter
        run: |
          if [ ! -d "/home/runner/flutter" ]; then
            echo "Flutter not cached, installing..."
            git clone https://github.com/flutter/flutter.git -b stable --depth 1 /home/runner/flutter
          else
            echo "Flutter found in cache"
          fi
          echo "/home/runner/flutter/bin" >> $GITHUB_PATH
          flutter --version

      # 5. Install GitHub CLI
      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install gh -y

      # 6. Setup Flutter and get dependencies
      - name: Setup Project
        run: |
          flutter doctor -v
          flutter pub get

      # 7. Extract version from pubspec.yaml
      - name: Get Version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          SAFE_VERSION=$(echo "$VERSION" | tr '+' '-')
          echo "version=$SAFE_VERSION" >> $GITHUB_OUTPUT
          echo "App version: $SAFE_VERSION"

      # 8. Build APK
      - name: Build APK
        run: flutter build apk --release

      # 9. Create GitHub Release and Upload APK
      - name: Create Release
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          FILE="build/app/outputs/flutter-apk/app-release.apk"
          
          echo "Creating APK release $TAG"
          
          # Create release with APK
          gh release create "$TAG" "$FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release $TAG" \
            --notes "Automated APK release from GitHub Actions
            
            Build Date: $(date)
            Commit: $GITHUB_SHA
            Workflow: $GITHUB_WORKFLOW"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
